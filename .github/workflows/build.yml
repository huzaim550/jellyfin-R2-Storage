name: build-and-publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.CloudBucket/Jellyfin.Plugin.CloudBucket.csproj -c Release -o publish

      - name: Package + build repository manifest
        run: |
          set -euo pipefail
          VERSION="$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.CloudBucket/Jellyfin.Plugin.CloudBucket.csproj | head -1)"
          ZIP_NAME="Jellyfin.Plugin.CloudBucket_${VERSION}.zip"
          mkdir -p site
          (cd publish && zip -q "../site/${ZIP_NAME}" \
            Jellyfin.Plugin.CloudBucket.dll \
            Jellyfin.Plugin.CloudBucket.deps.json \
            AWSSDK.S3.dll \
            AWSSDK.Core.dll)
          CHECKSUM="$(md5sum "site/${ZIP_NAME}" | cut -d' ' -f1)"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO}"
          scripts/generate-manifest.sh "${BASE_URL}" "${ZIP_NAME}" "${CHECKSUM}" "${VERSION}" > site/manifest.json
          echo "Published ${ZIP_NAME}"
          echo "Repository URL: ${BASE_URL}/manifest.json"
          cat site/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
