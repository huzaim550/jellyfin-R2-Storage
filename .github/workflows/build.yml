name: build-and-publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.CloudBucket/Jellyfin.Plugin.CloudBucket.csproj -c Release -o publish

      - name: Package + build repository manifest
        run: |
          set -euo pipefail
          VERSION="$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.CloudBucket/Jellyfin.Plugin.CloudBucket.csproj | head -1)"
          ZIP_NAME="Jellyfin.Plugin.CloudBucket_${VERSION}.zip"
          mkdir -p dist
          (cd publish && zip -q "../dist/${ZIP_NAME}" \
            Jellyfin.Plugin.CloudBucket.dll \
            Jellyfin.Plugin.CloudBucket.deps.json \
            AWSSDK.S3.dll \
            AWSSDK.Core.dll)
          CHECKSUM="$(md5sum "dist/${ZIP_NAME}" | cut -d' ' -f1)"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          scripts/generate-manifest.sh "${BASE_URL}" "${ZIP_NAME}" "${CHECKSUM}" "${VERSION}" > dist/manifest.json
          echo "Repository URL: ${BASE_URL}/manifest.json"
          echo "Plugin zip:     ${BASE_URL}/${ZIP_NAME}"
          cat dist/manifest.json

      - name: Publish release (zip + manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: |
            dist/*.zip
            dist/manifest.json
          fail_on_unmatched_files: true
